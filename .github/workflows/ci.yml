name: CI

# Android phone and Android TV builds only. No signing keys or Telegram credentials are used here.
# Documentation, site and non-Android project changes do not start this workflow; shared core/ui
# changes still do, because both Android variants use them.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - "fastlane/**"
      - "desktop/**"
      - "webapp/**"
      - "ios/**"
      - "iosApp/**"
      - "altstore/**"
      - "workers/**"
      - ".github/workflows/apple-ci.yml"
      - ".github/workflows/apple-release.yml"
      - ".github/workflows/webapp.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - "fastlane/**"
      - "desktop/**"
      - "webapp/**"
      - "ios/**"
      - "iosApp/**"
      - "altstore/**"
      - "workers/**"
      - ".github/workflows/apple-ci.yml"
      - ".github/workflows/apple-release.yml"
      - ".github/workflows/webapp.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No credentials on this path. The app compiles without them and says so at runtime,
      # which is exactly what a fork or a pull request should get.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      # sdkmanager publishes API 37 as android-37.0; AGP looks for android-37.
      - name: Add Android 37 SDK compatibility path
        run: |
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      # :core and :ui are shared Kotlin Multiplatform libraries; their JVM suites cover shared code.
      - name: Run core and ui tests
        run: ./gradlew :core:jvmTest :ui:jvmTest

      - name: Run phone and TV unit tests
        run: ./gradlew :app:testPhoneDebugUnitTest :app:testTvDebugUnitTest

      - name: Build phone and TV debug APKs
        run: ./gradlew :app:assemblePhoneDebug :app:assembleTvDebug

      - name: Upload phone and TV debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-debug
          path: |
            app/build/outputs/apk/phone/debug/*.apk
            app/build/outputs/apk/tv/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # Keep diagnostics from both device variants.
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            core/build/reports/tests/
            ui/build/reports/tests/
            app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
