name: Build APK

# Builds debug APKs (phone + TV) on demand or on push to main.
# Optionally injects Telegram credentials from repository secrets:
# TG_API_ID and TG_API_HASH. Without them the app still builds, but
# it cannot sign in to Telegram at runtime.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build debug APKs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Add Android 37 SDK compatibility path
        run: |
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Write Telegram credentials from secrets (optional)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ]; then
            cat > local.properties <<EOF
          TG_API_ID=$TG_API_ID
          TG_API_HASH=$TG_API_HASH
          EOF
            echo "Wrote local.properties with Telegram credentials."
          else
            echo "TG_API_ID/TG_API_HASH secrets not set; building without them."
          fi

      - name: Build phone and TV debug APKs
        run: ./gradlew :app:assemblePhoneDebug :app:assembleTvDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-apk
          path: |
            app/build/outputs/apk/phone/debug/*.apk
            app/build/outputs/apk/tv/debug/*.apk
          retention-days: 30
          if-no-files-found: error
